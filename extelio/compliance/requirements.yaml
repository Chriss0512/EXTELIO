      versionierten Parametern gespeichert.
    architecture_decision: >-
      Kapitel 6.2. Ein Pepper wird nur bei verfuegbarer Hardware genutzt;
      es gibt keinen softwarebasierten Ersatz.
    implementation_component: src/rust/auth/password.rs
    verification_method: automated_test
    automated_test_id: auth::password::tests
    manual_test_id: null
    evidence: "cargo test auth::password"
    release_status: implemented
