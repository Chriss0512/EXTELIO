# Compliance Evidence Matrix (Kapitel 17)
#
# Regel: Kein Control gilt als erfuellt, wenn Implementierung und belastbare
# Verifikation fehlen. Der Status ist deshalb bewusst dreistufig:
#   implemented  - umgesetzt und automatisiert verifiziert
#   partial      - umgesetzt, Verifikation noch nicht vollstaendig
#   open         - noch nicht umgesetzt
#
# Responsibility: PRODUCT | OPERATOR | SHARED | NOT_APPLICABLE
# Compliance-Ziel: certification-ready, nicht "zertifiziert".

meta:
  product: EXTELIO
  version: "0.1.0"
