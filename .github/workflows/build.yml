name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    name: Add-on-Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base:3.24-2026.08.0@sha256:db83d263152a02d6daf3415a73132b2386f43a03a9c248bdaabe047b067c8eea
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base:3.24-2026.08.0@sha256:265232fe91fb4271f75f17ebd4bb0749ab24fc8a64d8db38ddaccd460e9580ee
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Version lesen
        id: meta
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*"([^"]+)".*/\1/p' extelio/config.yaml | head -n1)"
          if [ -z "$version" ]; then
            echo "Keine Version aus extelio/config.yaml gelesen." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "EXTELIO version: $version"

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: extelio
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: extelio:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            WITH_FREESWITCH=0
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Startfaehigkeit pruefen
        run: |
          set -eu
          image="extelio:${{ steps.meta.outputs.version }}-${{ matrix.arch }}"
          # Bootstrap muss in einem leeren Datenverzeichnis durchlaufen.
          docker run --rm --platform ${{ matrix.platform }} \
            -e EXTELIO_DATA_DIR=/tmp/data -e EXTELIO_RUN_DIR=/tmp/run \
            "$image" /opt/extelio/bin/extelio-bootstrap
          # Die Weboberflaeche muss im Image liegen.
          docker run --rm --platform ${{ matrix.platform }} \
            "$image" test -f /opt/extelio/web/index.html
          echo "Image startet und enthaelt die Weboberflaeche."
